name: Checks
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.4'
          cache: false
      - run: go test ./...
      - run: go vet ./...
      - run: node .github/check-ui.cjs
      - run: sudo --preserve-env=PATH,GITHUB_ACTIONS bash .github/test-install.sh
