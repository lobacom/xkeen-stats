name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag (vX.Y.Z)'
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.4'
          cache: false
      - name: Validate and build
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(tr -d '\r\n' < VERSION)" = "$RELEASE_TAG"
          release_commit=$(git rev-parse HEAD)
          go test ./...
          go vet ./...
          python3 -B -m unittest discover -s tools
          node .github/check-ui.cjs
          sudo --preserve-env=PATH,GITHUB_ACTIONS bash .github/test-install.sh
          mkdir -p dist
          for arch in amd64 arm64 arm mips mipsle; do
            name="$arch"
            if [ "$arch" = arm ]; then name=armv7; fi
            GOOS=linux GOARCH="$arch" GOARM=7 GOMIPS=softfloat CGO_ENABLED=0 \
              go build -trimpath -ldflags="-s -w -X main.version=$RELEASE_TAG -X main.revision=$release_commit" \
              -o "dist/xkeen-stats-linux-$name" .
          done
          cp install.sh THIRD_PARTY_NOTICES.md dist/
          printf '# xkeen-stats %s\n' "$RELEASE_TAG" > dist/SHA256SUMS
          (cd dist && sha256sum xkeen-stats-linux-* install.sh THIRD_PARTY_NOTICES.md) >> dist/SHA256SUMS
      - name: Sign manifest
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: go run ./cmd/release-sign -manifest dist/SHA256SUMS -out dist/SHA256SUMS.sig
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --latest --title "XKeen Stats $RELEASE_TAG" --notes-file .github/release-notes.md
